<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>

    <header class="topbar">

        <strong>Účtování přijatých záloh</strong>

      <section class="intro">

      <form id="testForm" novalidate>

        <div class="submit-area">

          <a class="back-link" href="index.html">Zpět na výběr témat</a>

      </form>

      <section id="result" class="result hidden" aria-live="polite"></section>
