ry": "pravidlo 1:1", "difficulty": "medium", "question": "Co vyjadřuje pravidlo 1:1 uvedené v aktuálních podkladech EASA pro A2?", "options": ["Jako obecné pravidlo má být horizontální vzdálenost od nezúčastněné osoby alespoň stejná jako výška letu nad zemí", "Dron smí letět pouze ve výšce 1 m", "Každý let musí trvat přesně 1 minutu", "Maximální rychlost je vždy 1 m/s"], "correctAnswer": 0, "explanation": "EASA v AMC1 UAS.OPEN.030 uvádí pravidlo 1:1 jako referenční způsob určení horizontální vzdálenosti od nezúčastněných osob: vzdálenost by měla být alespoň stejná jako výška letu nad zemí, pokud není použit konkrétní výpočet založený na rychlosti UAS.", "source": [{"authority": "EASA", "document": "Easy Access Rules for Unmanned Aircraft Systems, AMC1 UAS.OPEN.030", "url": "https://www.easa.europa.eu/en/document-library/easy-access-rules/online-publications/easy-access-rules-unmanned-aircraft-systems"}], "status": "verified", "verificationBasis": "current_official_easa_amc", "tags": ["1:1", "vzdálenost", "výška"], "lastVerified": "2026-08-17", "verificationLevel": "official", "questionType": "training"}, {"id": "A2-RISK-007", "category": "zmírnění_rizik", "subcategory": "nezúčastněné osoby", "difficulty": "easy", "question": "Pilot chce v podkategorii A2 přeletět nezúčastněnou osobu, protože používá low-speed režim. Je takový postup v A2 dovolen?", "options": ["Ne. Low-speed režim umožňuje za stanovených podmínek snížit horizontální odstup, ale neumožňuje přelet nezúčastněné osoby", "Ano, pokud je UAS třídy C2", "Ano, pokud je osoba na otevřeném prostranství", "Ano, pokud pilot letí rychlostí nejvýše 5 m/s"], "correctAnswer": 0, "explanation": "Low-speed režim není výjimkou ze zákazu přeletu nezúčastněných osob. Umožňuje za stanovených podmínek snížit horizontální vzdálenost, nikoli osobu přímo přeletět.", "source": [{"authority": "EASA", "document": "Open Category — Low Risk — Civil Drones", "url": "https://www.easa.europa.eu/en/domains/drones-air-mobility/operating-drone/open-category-low-risk-civil-drones"}], "status": "verified", "verificationBasis": "current_official_easa", "tags": ["nezúčastněné osoby", "přelet"], "lastVerified": "2026-08-17", "verificationLevel": "training", "questionType": "training"}, {"id": "A2-RISK-008", "category": "zmírnění_rizik", "subcategory": "výška", "difficulty": "easy", "question": "Jaký je obecný maximální výškový limit provozu v otevřené kategorii podle EASA?", "options": ["120 m nad nejbližším bodem zemského povrchu", "50 m nad místem startu", "300 m nad místem startu", "Výška není v otevřené kategorii omezena"], "correctAnswer": 0, "explanation": "EASA uvádí pro otevřenou kategorii maximální výšku 120 m nad nejbližším bodem zemského povrchu, s dalšími specifickými pravidly a výjimkami.", "source": [{"authority": "EASA", "document": "Open Category — Low Risk — Civil Drones", "url": "https://www.easa.europa.eu/en/domains/drones-air-mobility/operating-drone/open-category-low-risk-civil-drones"}], "status": "verified", "verificationBasis": "current_official_easa", "tags": ["120 m", "výška"], "lastVerified": "2026-08-17", "verificationLevel": "training", "questionType": "training"}, {"id": "A2-RISK-009", "category": "zmírnění_rizik", "subcategory": "C2", "difficulty": "easy", "question": "Jaká třída UAS je podle EASA určena pro provoz v podkategorii A2?", "options": ["C2", "C0", "C4", "C5"], "correctAnswer": 0, "explanation": "EASA uvádí, že UAS třídy C2 lze provozovat v podkategorii A2.", "source": [{"authority": "EASA", "document": "Drones (UAS) FAQ / Open category", "url": "https://www.easa.europa.eu/en/the-agency/faqs/drones-uas"}, {"authority": "EASA", "document": "Open Category — Low Risk — Civil Drones", "url": "https://www.easa.europa.eu/en/domains/drones-air-mobility/operating-drone/open-category-low-risk-civil-drones"}], "status": "verified", "verificationBasis": "current_official_easa", "tags": ["C2", "A2"], "lastVerified": "2026-08-17", "verificationLevel": "training", "questionType": "training"}, {"id": "A2-RISK-010", "category": "zmírnění_rizik", "subcategory": "A2 podmínky", "difficulty": "medium", "question": "Která trojice oblastí tvoří aktuální tematický základ A2 testu podle ÚCL?", "options": ["Meteorologie; provádění letů bezpilotních letadel; technická a provozní opatření ke zmírnění rizik na zemi", "Navigace; radiokomunikace; letecká angličtina", "První pomoc; požární ochrana; účetnictví", "Pouze konstrukce dronu"], "correctAnswer": 0, "explanation": "Aktuální stránka ÚCL uvádí právě tyto tři oblasti jako témata 30otázkového A2 testu.", "source": [{"authority": "ÚCL", "document": "Postup žádosti o vydání osvědčení o způsobilosti dálkově řídícího pilota", "url": "https://www.caa.gov.cz/provoz/bezpilotni-letectvi/otevrena-kategorie-open/zpusobilost-pilotu-pro-provoz-v-podkategorii-provozu-a2/postup-zadosti-o-vydani-osvedceni-o-zpusobilosti-dalkove-ridiciho-pilota/"}], "status": "verified", "verificationBasis": "current_official_page", "tags": ["A2", "okruh", "zkouška"], "lastVerified": "2026-08-17", "verificationLevel": "official", "questionType": "training"}];
let current=0;
let selected=Array(questions.length).fill(null);
let seconds=1800;

const $=id=>document.getElementById(id);

function shuffleAnswers(q){
  return q.options.map((text,index)=>({text,index}));
}

function render(){
  const q=questions[current];
  $("counter").textContent=`Otázka ${current+1} z ${questions.length}`;
  $("answered").textContent=`${selected.filter(x=>x!==null).length} zodpovězeno`;
  $("sideCount").textContent=`${selected.filter(x=>x!==null).length}/${questions.length}`;
  $("bar").style.width=`${((current+1)/questions.length)*100}%`;
  $("category").textContent=(q.category==="meteorologie"?"Meteorologie":q.category==="uas_vykonnost"?"Provádění letů / UAS":"Zmírnění rizik");
  $("difficulty").textContent=q.difficulty==="easy"?"Lehká":q.difficulty==="medium"?"Střední":"Těžká";
  $("question").textContent=q.question;
  document.querySelector(".question-number").textContent=String(current+1).padStart(2,"0");

  const ans=$("answers"); ans.innerHTML="";
  shuffleAnswers(q).forEach(a=>{
    const b=document.createElement("button");
    b.className="answer"+(selected[current]===a.index?" selected":"");
    b.innerHTML=`<span class="letter">${String.fromCharCode(65+a.index)}</span><span>${a.text}</span>`;
    b.onclick=()=>{selected[current]=a.index;render();};
    ans.appendChild(b);
  });
  $("prev").disabled=current===0;
  $("next").textContent=current===questions.length-1?"Dokončit test":"Další otázka →";
  renderGrid();
}

function renderGrid(){
  const g=$("questionGrid"); g.innerHTML="";
  questions.forEach((_,i)=>{
    const b=document.createElement("button");
    b.textContent=i+1;
    b.className=(i===current?"current ":"")+(selected[i]!==null?"answered":"");
    b.onclick=()=>{current=i;render()};
    g.appendChild(b);
  });
}

function next(){
  if(current<questions.length-1){current++;render()}
  else finish();
}
function prev(){if(current>0){current--;render()}}
function finish(){
  const unanswered=selected.filter(x=>x===null).length;
  if(unanswered && !confirm(`Máte ${unanswered} nezodpovězených otázek. Opravdu chcete test ukončit?`)) return;
  alert("Toto je pouze designový prototyp. Vyhodnocení připojíme v další fázi.");
}
function tick(){
  seconds--;
  if(seconds<0)seconds=0;
  const m=String(Math.floor(seconds/60)).padStart(2,"0");
  const s=String(seconds%60).padStart(2,"0");
  $("timer").textContent=`${m}:${s}`;
  if(seconds>0)setTimeout(tick,1000);
}
$("next").onclick=next;
$("prev").onclick=prev;
$("finishTop").onclick=finish;
$("finishBottom").onclick=finish;
render(); tick();
</script>
