<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>A2 Drone Trainer – Test</title>
<link rel="stylesheet" href="test.css">
</head>
<body>
<main class="wrap">
<header class="top">
  <div><div class="eyebrow">A2 DRONE TRAINER</div><h1 id="modeTitle">Trénink</h1></div>
  <div class="mode-switch" role="group" aria-label="Režim">
    <button id="learnMode" class="mode-btn active">Učení</button>
    <button id="examMode" class="mode-btn">Zkouška</button>
  </div>
</header>

<section class="progress">
  <div><strong id="counter">Načítání…</strong><span id="answered"></span></div>
  <i id="bar"></i>
</section>

<section class="question-card">
  <div class="meta"><span id="cat"></span><span id="diff"></span></div>
  <div class="num" id="num"></div>
  <h2 id="question"></h2>
  <div id="answers"></div>
  <div id="explanation" class="explanation hidden" tabindex="-1"></div>
</section>

<nav class="floating-nav" aria-label="Navigace otázkami">
  <button id="prev" class="secondary">← Předchozí</button>
  <button id="next" class="primary">Další →</button>
</nav>

<section id="result" class="result hidden"></section>
</main>
<script src="test.js"></script>
</body>
</html>
